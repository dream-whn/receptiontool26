<style>

#myrec{font-size:1.6rem;padding:10px 22px}
.fb{font-size:5.5rem;min-height:6.5rem;line-height:1.2}
.fb.ok{color:var(--ok);animation:pp .5s}
.fb.no{color:var(--no);animation:sh .4s}
@keyframes pp{0%{transform:scale(.3)}70%{transform:scale(1.25)}100%{transform:scale(1)}}

.ttl{font-size:1.4rem;font-weight:700;margin:0 0 6px}

        <button class="sec" id="hear">🔊</button>

  <div class="card">

</div>
<div id="modal"><div class="box"><div id="mtitle"></div><input type="password" id="mpw" autocomplete="off"><button id="mok">確定</button><button class="sec" id="mcancel">取消</button></div></div>

<script>

2": "#3b9eff", "n1": "#fff", "n2": "#efe0ff", "nb": "#b890ff", "ns": "rgba(124,77,224,.3)"}, "deco": ["🍭", "🍬", "🧁", "🍩", "🎀", "🦄", "⭐", "🍓"], "dark": false}, "sunset": {"label": "夕陽", "v": {"g0": "#ffb88a", "g1": "#ffd9a8", "g2": "#fff0c0", "g3": "#ffd1dc", "tx": "#5a3320", "bd": "#ff9f4a", "card": "#fff", "bg": "#fff3e3", "sh": "rgba(230,120,40,.35)", "pb": "#ffd199", "ap1": "#ff9a62", "ap2": "#e8632a", "s1": "#fff", "s2": "#ffe5c4", "go1": "#7fd96a", "go2": "#3fa535", "mic1": "#ff7d9c", "mic2": "#d6336c", "ear1": "#7cc4ff", "ear2": "#3b8fe0", "n1": "#fff", "n2": "#ffe5c4", "nb": "#ff9f4a", "ns": "rgba(230,120,40,.3)"}, "deco": ["🌅", "☀️", "🦜", "🌴", "🐪", "🌻", "⭐", "🦋"], "dark": false}, "night": {"label": "夜空", "v": {"g0": "#1a1f45", "g1": "#262c5c", "g2": "#33397a", "g3": "#3d3a78", "tx": "#f3efe0", "bd": "#7c8cff", "card": "#2a2f5a", "bg": "#1e2350", "sh": "rgba(0,0,0,.35)", "pb": "#5a66c9", "ap1": "#8c9bff", "ap2": "#5566e6", "s1": "#3a4278", "s2": "#2f3566", "go1": "#4fd18b", "go2": "#1f9e5c", "mic1": "#ff7aa8", "mic2": "#d63a78", "ear1": "#5fc3ff", "ear2": "#2f8fe0", "n1": "#3a4278", "n2": "#2f3566", "nb": "#7c8cff", "ns": "rgba(0,0,0,.35)"}, "deco": ["🌙", "⭐", "🌟", "✨", "🪐", "🚀", "☁️", "🦉"], "dark": true}};

(function(){const T=THEMES[Q.get("theme")]||THEMES.sky,r=document.documentElement.style;

function load(){try{const s=localStorage.getItem(KEY);words=s?JSON.parse(s):DEF.slice()}catch(e){words=DEF.slice()}if(!words.length)words=DEF.slice()}
function save(){try{localStorage.setItem(KEY,JSON.stringify(words))}catch(e){alert("儲存空間已滿,這次的更改沒有保存。請刪除一些不用的詞語或照片")}}
function draw(el,it){el.innerHTML="";if(it.img){const i=new Image();i.src=it.img;el.appendChild(i)}else el.textContent=it.e||"❓"}
function show(){tries=0;$("myrec").style.display="none";$("fb").textContent="";$("fb").className="fb";$("heard").textContent="";
  let n;do{n=words[Math.floor(Math.random()*words.length)]}while(words.length>1&&cur&&n===cur);cur=n;
  draw($("pic"),cur);}
function speak(t){try{const u=new SpeechSynthesisUtterance(t);u.lang="zh-CN";u.rate=.8;speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}}
function beep(ok){try{const c=new (window.AudioContext||window.webkitAudioContext)();(ok?[660,880,1100]:[300,220]).forEach((f,i)=>{const o=c.createOscillator(),g=c.createGain();o.frequency.value=f;o.connect(g);g.connect(c.destination);g.gain.value=.15;o.start(c.currentTime+i*.15);o.stop(c.currentTime+i*.15+.14)})}catch(e){}}
const norm=s=>(s||"").replace(/[\s,。,.!?!?、]/g,"");
function result(ok,text){logAttempt(ok?"great":"no");const f=$("fb");
  if(ok){burst();f.textContent="⭕";f.className="fb ok";stars++;$("stars").textContent="⭐ "+stars;speak("太棒了")}
  else{f.textContent="❌";f.className="fb no";}
  beep(ok)}
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
if(!SR){$("note").textContent="此瀏覽器不支援語音辨識,請用 Chrome 或 Safari;可由老師按下方按鈕判斷。";}
function manual(){const d=document.createElement("div");d.id="mj";d.innerHTML='<button onclick="result(true)">⭕</button><button class="sec" onclick="result(false)">❌</button>';$("note").appendChild(d)}
if(!SR)manual();
const pyN=(t,tone)=>{try{return pinyinPro.pinyin(norm(t),{toneType:tone?"symbol":"none",type:"array"}).join("").replace(/\s/g,"")}catch(e){return norm(t)}};
function judge(alts){
  const tw=norm(cur.w),tp=pyN(cur.w,0),tt=pyN(cur.w,1);let r="no";
  alts.forEach(a=>{if(norm(a).includes(tw)||pyN(a,1).includes(tt))r="great";else if(r!=="great"&&pyN(a,0).includes(tp))r="near"});
  if(r==="great")result(true);
  else if(r==="near"){logAttempt("near");$("fb").textContent="👍";$("fb").className="fb";$("heard").textContent="很接近了!注意讀音和聲調,再試一次"}
  else result(false)}
let mr=null,chunks=[],aurl=null,stream=null;
function stopRec(){try{if(mr&&mr.state==="recording")mr.stop()}catch(e){}}
$("mic").onclick=async()=>{
  if(!SR)return;
  if(listening){rec&&rec.stop();return}
  $("myrec").style.display="none";if(aurl){URL.revokeObjectURL(aurl);aurl=null}chunks=[];
  try{stream=await navigator.mediaDevices.getUserMedia({audio:true});mr=new MediaRecorder(stream);
    mr.ondataavailable=e=>{if(e.data&&e.data.size)chunks.push(e.data)};
    mr.onstop=()=>{stream.getTracks().forEach(t=>t.stop());if(chunks.length){aurl=URL.createObjectURL(new Blob(chunks,{type:mr.mimeType||"audio/webm"}));$("myrec").style.display=""}};
    mr.start()}catch(e){mr=null}
  rec=new SR();rec.lang="zh-CN";rec.interimResults=false;rec.maxAlternatives=5;
  rec.onstart=()=>{listening=true;$("mic").textContent="🛑";$("mic").classList.add("rec");$("fb").textContent="👂";$("fb").className="fb"};
  rec.onend=()=>{listening=false;$("mic").textContent="🎤";$("mic").classList.remove("rec");stopRec()};
  rec.onerror=e=>{$("fb").textContent="";$("heard").textContent=e.error==="not-allowed"?"請允許使用麥克風":"沒聽清楚,再說一次"};
  rec.onresult=e=>{judge([...e.results[0]].map(a=>a.transcript))};
  try{rec.start()}catch(e){}
};
$("myrec").onclick=()=>{if(aurl)new Audio(aurl).play()};
function playModel(it){if(it&&it.a){try{new Audio(it.a).play();return}catch(e){}}speak(it.w)}
$("hear").onclick=()=>playModel(cur);
$("next").onclick=show;

function render(){const L=$("list");L.innerHTML="<b>詞語列表("+words.length+")</b>";
  words.forEach((it,i)=>{const d=document.createElement("div");d.className="item";const e=document.createElement("div");e.className="e";draw(e,it);
    const t=document.createElement("span");t.className="t";t.textContent=it.w+(it.p?"  "+it.p:"");
    const b=document.createElement("button");b.className="sec";b.textContent="🗑️";b.onclick=()=>{words.splice(i,1);save();render()};
    const b2=document.createElement("button");b2.className="sec";b2.textContent="✏️";b2.onclick=()=>{const nw=prompt("詞語",it.w);if(nw===null)return;const w2=nw.trim()||it.w;const np=prompt("拼音(留空則自動產生)",it.w===w2?(it.p||py(w2)):py(w2));if(np===null)return;it.w=w2;it.p=np.trim()||py(w2);save();render()};
    const rb=document.createElement("button");rb.className="sec";rb.textContent=it.a?"🎙️✓":"🎙️";rb.title="錄標準讀音";rb.onclick=()=>recModel(it,rb);
    const pb=document.createElement("button");pb.className="sec";pb.textContent="▶️";pb.style.display=it.a?"":"none";pb.onclick=()=>playModel(it);
    const ib=document.createElement("button");ib.className="sec";ib.textContent="🖼️";ib.title="更換成自己的照片";
    ib.onclick=()=>{const inp=document.createElement("input");inp.type="file";inp.accept="image/*";inp.onchange=()=>{const f=inp.files[0];if(f)resizeFile(f,u=>{it.img=u;save();render()})};inp.click()};
    d.append(e,t,rb,pb,ib,b2,b);L.appendChild(d)})}
async function recModel(it,btn){
  if(btn._stop){btn._stop();return}
  try{const st=await navigator.mediaDevices.getUserMedia({audio:true}),ch=[],m=new MediaRecorder(st,{audioBitsPerSecond:24000});
    btn.textContent="⏹️";btn._stop=()=>{if(m.state==="recording")m.stop()};
    m.ondataavailable=e=>{if(e.data&&e.data.size)ch.push(e.data)};
    m.onstop=()=>{st.getTracks().forEach(t=>t.stop());const fr=new FileReader();fr.onload=()=>{if(fr.result.length>200000){alert("錄音太長,請縮短再錄");render();return}it.a=fr.result;save();render()};fr.readAsDataURL(new Blob(ch,{type:m.mimeType||"audio/webm"}))};
    m.start();setTimeout(()=>{if(m.state==="recording")m.stop()},4000)
  }catch(e){alert("無法使用麥克風,請允許麥克風權限")}}
function resizeFile(f,cb){const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const c=document.createElement("canvas"),k=Math.min(1,320/Math.max(im.width,im.height));c.width=im.width*k;c.height=im.height*k;c.getContext("2d").drawImage(im,0,0,c.width,c.height);cb(c.toDataURL("image/jpeg",.8))};im.onerror=()=>alert("無法讀取這張圖片");im.src=r.result};r.readAsDataURL(f)}
let upImg=null;
function prev(){const p=$("prev");p.innerHTML="";if(upImg){const i=new Image();i.src=upImg;i.style.cssText="width:56px;height:56px;border-radius:10px;object-fit:cover";p.appendChild(i)}else p.textContent=$("ne").value||""}
$("auto").onclick=()=>{const w=$("nw").value.trim();let e=EMOJI[w];if(!e){const k=Object.keys(EMOJI).find(k=>w.includes(k)||k.includes(w)&&w);e=k&&EMOJI[k]}
  if(e){$("ne").value=e;upImg=null}else{alert("詞庫沒有「"+w+"」的圖,請自行輸入表情符號或上傳照片")}prev()};
$("ne").oninput=prev;$("nw").onblur=()=>{if(!$("ne").value&&!upImg&&EMOJI[$("nw").value.trim()])$("auto").click()};
$("nf").onchange=ev=>{const f=ev.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const c=document.createElement("canvas"),s=Math.min(1,320/Math.max(im.width,im.height));c.width=im.width*s;c.height=im.height*s;c.getContext("2d").drawImage(im,0,0,c.width,c.height);upImg=c.toDataURL("image/jpeg",.8);prev()};im.src=r.result};r.readAsDataURL(f)};
$("add").onclick=()=>{const w=$("nw").value.trim();if(!w){alert("請輸入詞語");return}
  const e=$("ne").value.trim()||EMOJI[w];if(!e&&!upImg){alert("請選擇圖片");return}
  words.push({w,p:$("np").value.trim()||py(w),e:upImg?undefined:e,img:upImg||undefined});save();
  $("nw").value=$("np").value=$("ne").value="";$("np").dataset.m="";$("nf").value="";upImg=null;prev();render()};
$("reset").onclick=()=>{if(confirm("還原預設詞語?")){words=DEF.slice();save();render()}};
$("toAdmin2").onclick=()=>$("toAdmin").onclick();
$("toAdmin").onclick=()=>askPin("請輸入老師密碼",v=>{if(v===getPin()){$("play").style.display="none";$("who").style.display="none";$("clsPick").style.display="none";$("admin").style.display="block";render();renderStu();renderDiag()}else alert("密碼不正確")});
$("chpw").onclick=()=>askPin("輸入新密碼",v=>{if(!v)return;try{localStorage.setItem(PK,v);alert("密碼已更新")}catch(e){alert("無法儲存密碼")}});
$("nw").oninput=()=>{const n=$("np");if(!n.dataset.m)n.value=py($("nw").value.trim())};
$("np").oninput=()=>{$("np").dataset.m="1"};
$("autopy").onclick=()=>{$("np").dataset.m="";$("np").value=py($("nw").value.trim())};
$("back").onclick=()=>{$("admin").style.display="none";if(who){$("play").style.display="block";cur=null;show()}else if(CLS||!PICK.length)startWho();else showPick()};
function readJ(k){try{return JSON.parse(localStorage.getItem(k)||"[]")}catch(e){return[]}}
function writeJ(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
function logAttempt(r){
  if(!cur||!who)return;tries++;
  const a={d:Date.now(),n:who,w:cur.w,r:r,k:tries,c:CLS,s:SHEET_URL};
  const L=readJ(LOGK);L.push(a);writeJ(LOGK,L.slice(-3000));
  if(SHEET_URL){const q=readJ(QK);q.push(a);writeJ(QK,q);flush()}
}
async function flush(){
  if(!SHEET_URL||flushing)return;flushing=true;
  try{for(;;){const q=readJ(QK);if(!q.length)break;
      try{const it=q[0],u=okSheet(it.s)?it.s:SHEET_URL,bd=Object.assign({},it);delete bd.s;await fetch(u,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(bd)})}catch(e){break}
      const q2=readJ(QK);q2.shift();writeJ(QK,q2)}}
  finally{flushing=false}
}
function renderNames(){const b=$("names");b.innerHTML="";readJ(NMK).forEach(n=>{const c=document.createElement("button");c.type="button";c.textContent="🧒 "+n;c.onclick=()=>{$("pname").value=n;$("pgo").click()};b.appendChild(c)})}
function burst(){const E=["⭐","🎉","✨","🌟","💖","🎈"];for(let i=0;i<14;i++){const e=document.createElement("span");e.className="pop";e.textContent=E[i%E.length];e.style.left=(15+Math.random()*70)+"vw";e.style.top=(35+Math.random()*30)+"vh";e.style.animationDelay=(Math.random()*.25)+"s";document.body.appendChild(e);setTimeout(()=>e.remove(),1800)}}
function startWho(){let last="";try{last=localStorage.getItem(NAMEK)||""}catch(e){}$("pname").value=last;renderNames();$("who").style.display="";$("play").style.display="none";setTimeout(()=>$("pname").focus(),50)}
$("pgo").onclick=()=>{const n=$("pname").value.trim();if(!n){$("pname").focus();return}
  who=n;try{localStorage.setItem(NAMEK,n)}catch(e){}
  {const NL=readJ(NMK).filter(x=>x!==n);NL.unshift(n);writeJ(NMK,NL.slice(0,24))}
  $("who2").textContent="👤 "+n+(CLS?"　🏫 "+CLS:"");$("who").style.display="none";$("play").style.display="block";
  stars=0;$("stars").textContent="⭐ 0";cur=null;show()};
$("pname").onkeydown=e=>{if(e.key==="Enter"&&!e.isComposing)$("pgo").click()};
$("switch").onclick=startWho;
const RN={great:"說得很好",near:"接近",no:"再試"};
const fmt=d=>new Date(d).toLocaleString("zh-HK",{hour12:false});
function renderDiag(){
  const d=$("diag"),q=readJ(QK);d.innerHTML="<b>試算表連線</b>";
  const p=document.createElement("div");p.className="small";
  p.textContent=(CLS?("班別:"+CLS+"。"):"⚠️ 此連結沒有指定班別,紀錄會記在「未分班」。請改用「網址?class=班名」的連結。")+(SHEET_URL?("已設定試算表網址。待傳送的紀錄:"+q.length+" 筆"):"尚未設定試算表網址(紀錄只存在此裝置)");d.appendChild(p);
  if(!SHEET_URL)return;
  const out=document.createElement("div");out.className="small";out.style.margin="8px 0";
  const b=document.createElement("button");b.className="sec";b.textContent="🔌 測試連線";
  b.onclick=async()=>{out.textContent="測試中…";let ping="err";
    try{const r=await fetch(SHEET_URL+"?action=ping");const t=await r.text();ping=t.trim().slice(0,2)==="ok"?"ok":"bad"}catch(e){}
    try{await fetch(SHEET_URL,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({d:Date.now(),n:"測試",w:"連線測試",r:"great",k:1,c:CLS})});
      out.textContent=(ping==="ok"?"✅ 已連到 Apps Script,":"⚠️ 無法確認 Apps Script 的回應(可能是網址錯誤、存取權限不是「所有人」,或 Apps Script 還沒更新成新版),")+"並已送出一筆測試紀錄(名字「測試」)。請到試算表看看有沒有出現。"}
    catch(e){out.textContent="❌ 連不上網路或網址,請檢查網路和網址。"}};
  const b2=document.createElement("button");b2.className="sec";b2.textContent="📤 重新傳送待傳送紀錄";
  b2.onclick=()=>{out.textContent="傳送中…";flush().then(()=>{renderDiag()})};
  d.append(b,b2,out);
}
function renderStu(){
  const L=readJ(LOGK),by={};
  L.forEach(a=>{const s=by[a.n]||(by[a.n]={n:a.n,tries:0,great:0,words:new Set(),last:0,days:new Set(),wd:{}});s.tries++;{const x=s.wd[a.w]||(s.wd[a.w]={t:0,f:0,l:""});x.t++;x.l=a.r;if(a.r!=="great")x.f++}if(a.r==="great"){s.great++;s.words.add(a.w)}s.last=Math.max(s.last,a.d);s.days.add(new Date(a.d).toDateString())});
  const fu=s=>Object.entries(s.wd).filter(([w,x])=>x.t>=2&&x.l!=="great").sort((p,q)=>q[1].f-p[1].f).map(([w,x])=>w+"("+x.f+"次未對)").join("、");
  const rows=Object.values(by).sort((x,y)=>y.last-x.last),box=$("stu");
  box.innerHTML="<b>學生紀錄("+rows.length+" 人)</b>";
  if(!rows.length){box.insertAdjacentHTML("beforeend",'<div class="small">還沒有紀錄。學生輸入名字並練習後,會顯示在這裡。</div>');return}
  const t=document.createElement("table");t.style.cssText="width:100%;border-collapse:collapse;font-size:.95rem;margin-top:8px;white-space:nowrap";
  const hr=document.createElement("tr");["名字","練習次數","說對次數","說對率","已掌握詞語","練習日數","最近練習","需要跟進的詞語"].forEach(x=>{const th=document.createElement("th");th.style.cssText="text-align:left;padding:6px;border-bottom:2px solid var(--bd)";th.textContent=x;hr.appendChild(th)});t.appendChild(hr);
  rows.forEach(s=>{const tr=document.createElement("tr");[s.n,s.tries,s.great,Math.round(s.great/s.tries*100)+"%",s.words.size+" / "+words.length,s.days.size,fmt(s.last),fu(s)].forEach(v=>{const td=document.createElement("td");td.style.cssText="padding:6px;border-bottom:1px solid var(--bd)";td.textContent=v;tr.appendChild(td)});t.appendChild(tr)});
  const w=document.createElement("div");w.style.overflowX="auto";w.appendChild(t);box.appendChild(w);
  const b1=document.createElement("button");b1.className="sec";b1.textContent="📋 複製全部紀錄(貼到 Excel)";
  b1.onclick=()=>{const tsv=["時間\t名字\t詞語\t結果\t第幾次"].concat(L.slice().reverse().map(a=>[fmt(a.d),a.n,a.w,RN[a.r],a.k].join("\t"))).join("\n");
    (navigator.clipboard?navigator.clipboard.writeText(tsv):Promise.reject()).then(()=>alert("已複製"),()=>prompt("請全選複製:",tsv))};
  const b2=document.createElement("button");b2.className="sec";b2.textContent="🗑️ 清除此裝置的紀錄";
  b2.onclick=()=>{if(confirm("清除此裝置上所有學生紀錄?(Google 試算表內的紀錄不受影響)")){writeJ(LOGK,[]);renderStu()}};
  const b3=document.createElement("button");b3.className="sec";b3.textContent="🧒 清除名字按鈕";b3.onclick=()=>{writeJ(NMK,[]);alert("已清除")};
  box.append(b1,b2,b3);
}
const WK="pth_sheetwords_v1"+SFX;
function emojiFor(w){if(EMOJI[w])return EMOJI[w];const k=Object.keys(EMOJI).find(k=>w.length>1&&(w.includes(k)||k.includes(w)));return k?EMOJI[k]:""}
function localWords(){try{const x=localStorage.getItem(KEY);return x?JSON.parse(x):[]}catch(e){return[]}}
function applySheet(list){
  const by={};localWords().forEach(x=>{if(x&&x.w)by[x.w]=x});
  const out=[];
  list.forEach(r=>{const w=String(r[0]||"").trim();if(!w)return;
    const l=by[w]||{},li=(l.img&&String(l.img).indexOf("data:")===0)?l.img:null;
    const e=String(r[1]||"").trim()||emojiFor(w),url=String(r[2]||"").trim(),img=li||url||undefined;
    if(!img&&!e)return;
    out.push({w:w,p:py(w),e:img?undefined:e,img:img,a:l.a})});
  if(out.length){words=out;return true}return false}
async function loadSheetWords(){
  if(!SHEET_URL)return;
  try{const c=localStorage.getItem(WK);if(c)applySheet(JSON.parse(c))}catch(e){}
  try{const r=await fetch(SHEET_URL+"?action=words&class="+encodeURIComponent(CLS)),o=await r.json();
    if(o&&Array.isArray(o.words)&&o.words.length){
      try{localStorage.setItem(WK,JSON.stringify(o.words))}catch(e){}
      if(applySheet(o.words)&&$("admin").style.display==="block")render()}
    return true}catch(e){return false}}
function initSheetNote(){
  const n=$("sheetnote");if(!SHEET_URL){n.textContent="";return}
  n.textContent="詞語由 Google 試算表的「詞語」工作表管理:在試算表新增、修改或刪除詞語,小朋友打開網站時會自動更新。這裡新增的詞語只會留在這部裝置;照片和錄音仍在這裡設定,會套用到試算表裡同名的詞語。";
  const b=document.createElement("button");b.className="sec";b.textContent="🔄 重新讀取試算表的詞語";
  b.onclick=async()=>{b.textContent="讀取中…";const ok=await loadSheetWords();b.textContent=ok?"✅ 已更新":"❌ 讀取失敗";setTimeout(()=>{b.textContent="🔄 重新讀取試算表的詞語"},2000);render()};
  n.appendChild(document.createElement("br"));n.appendChild(b)}
const PICK=(()=>{const c=(Q.get("classes")||"").split(",").map(x=>x.replace(/[\[\]*?:\/\\.]/g,"").trim()).filter(Boolean).slice(0,12);return c.length?c:(CUSTOM?[]:["THAM","THPM","JKAM","JKPM","RFAM","RFPM"])})();
function goClass(c){const u=new URL(location.href);if(c)u.searchParams.set("class",c);else u.searchParams.delete("class");location.href=u.toString()}
function showPick(){const b=$("clsBtns");b.innerHTML="";let last="";try{last=localStorage.getItem("pth_lastcls")||""}catch(e){}
  const L=PICK.slice();if(last&&L.indexOf(last)>0){L.splice(L.indexOf(last),1);L.unshift(last)}
  L.forEach(c=>{const x=document.createElement("button");x.type="button";x.textContent=(c===last?"⭐ ":"🏫 ")+c;x.onclick=()=>{try{localStorage.setItem("pth_lastcls",c)}catch(e){}goClass(c)};b.appendChild(x)});
  $("clsPick").style.display="";$("who").style.display="none";$("play").style.display="none"}
$("toAdmin3").onclick=()=>$("toAdmin").onclick();
$("chcls").onclick=()=>goClass("");if(!PICK.length)$("chcls").style.display="none";
if(CLS)$("clsl").textContent="🏫 "+CLS;
load();flush();if(CLS||!PICK.length)startWho();else showPick();initSheetNote();loadSheetWords();
